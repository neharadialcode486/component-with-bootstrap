<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="/assets/css/navtabs.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  </head>
  <body class="font-inter">
 
<section class="min-vh-100 d-flex justify-content-center align-items-center">
        <div class="container mt-5">
            <div
                class="shop-btn-box d-flex justify-between align-items-center ">
                <button data-target="djellabas"
                    class="py-3 shop-nav-btn active fw-bold  text-white fs-5 ">Djellabas</button>
                <button data-target="gandoras"
                    class="py-3 shop-nav-btn fw-bold text-lg fs-5">Gandoras</button>
                <button data-target="caftans"
                    class="py-3 shop-nav-btn fw-bold text-lg fs-5">Revenue</button>
                <button data-target="djellabas"
                    class="py-3 shop-nav-btn fw-bold text-lg fs-5">Campaigns</button>
            </div>
            <div class="mt-4 shop-img-slider">
                <div id="djellabas" class="tabsInfoTwo">
                    <div class="swiper w-100 max-w-5xl mx-auto pb-20">
                        <div class="swiper-wrapper d-flex gap-6">
                            <div class="swiper-slide">
                                <img class="img-max-w w-100 " src="./assets/images/png/dajella.png"
                                    alt="Caftans">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100 " src="./assets/images/png/gandras.png"
                                    alt="Djellabas">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100" src="/assets/images/png/cafftles.png"
                                    alt="Gandoras">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100" src="./assets/images/png/dajella.png"
                                    alt="Gandoras">
                            </div>
                        </div>
                        <div class="swiper-pagination "></div>
                    </div>
                </div>
                <div id="gandoras" class="d-none tabsInfoTwo">
                    <div class="swiper w-100 max-w-5xl mx-auto pb-20">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide">
                                <img class="img-max-w w-100 " src="./assets/images/png/gandras.png"
                                    alt="Caftans">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100 " src="/assets/images/png/cafftles.png"
                                    alt="Djellabas">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100" src="./assets/images/png/dajella.png"
                                    alt="Gandoras">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100" src="./assets/images/png/gandras.png"
                                    alt="Gandoras">
                            </div>
                        </div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>
                <div id="caftans" class="d-none tabsInfoTwo">
                    <div class="swiper w-100 max-w-5xl mx-auto pb-20">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide">
                                <img class="img-max-w w-100 " src="/assets/images/png/cafftles.png"
                                    alt="Caftans">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100 " src="./assets/images/png/dajella.png"
                                    alt="Djellabas"></div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100" src="./assets/images/png/gandras.png"
                                    alt="Gandoras">
                            </div>
                            <div class="swiper-slide">
                                <img class="img-max-w w-100" src="/assets/images/png/cafftles.png"
                                    alt="Gandoras">
                            </div>
                        </div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </section>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/assets/js/navtabs.js"></script>
  </body>
</html>
