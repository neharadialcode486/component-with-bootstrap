<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop down</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/third-dropdown.css">
</head>

<body class="bg-black">
    <section class="min-vh-100 d-flex justify-content-center align-items-center">
        <!-- Dropdown 3 -->
        <div class="position-relative d-inline-block group ">
            <div
                class="d-flex bg-dark-red px-3 py-2 align-items-center gap-3 w-100 border border-white rounded cursor-pointer button">
                <button class="text-white fw-semibold btn  p-0 ">Advertisement</button>
                <svg class="arrow-icon transition-transform" width="12" height="8" viewBox="0 0 12 8" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z" fill="white" />
                </svg>
            </div>
            <div class="dropdown-menu hidden position-absolute z-10 group-hover-show rounded pt-1">
                <div class="dropdown-item-wrapper">
                    <div class="d-flex align-items-center gap-2 py-1 px-3">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a href="#" class="text-white btn btn-link dropdown-item dropdown-item-1 active">All</a>
                    </div>
                    <div class="d-flex align-items-center gap-2 py-1 px-3">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a href="#"
                            class="text-white btn btn-link dropdown-item dropdown-item-2 bg-red border-red">Teststrasse
                            10</a>
                    </div>
                    <div class="d-flex align-items-center gap-2 py-1 px-3">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a href="#"
                            class="text-white btn btn-link dropdown-item dropdown-item-3 bg-blue border-blue">Hohlstrasse
                            11</a>
                    </div>
                    <div class="d-flex align-items-center gap-2 py-1 px-3">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a href="#"
                            class="text-white btn btn-link dropdown-item dropdown-item-4 bg-orange border-orange">Culmannste
                            64</a>
                    </div>
                    <div class="d-flex align-items-center gap-2 py-1 px-3">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a href="#"
                            class="text-white btn btn-link dropdown-item dropdown-item-5 bg-teal border-teal">Lucernesti
                            96</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
