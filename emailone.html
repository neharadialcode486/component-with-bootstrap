<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>email-js-one-bootstrap</title>
    <link rel="stylesheet" href="/assets/css/email.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="font-inter">
    <!-- ---first-form -->
    <section
      class="min-vh-100 d-flex align-items-center justify-content-center email-one-parent-xl-my"
    >
      <div class="container email-one-max-xl-w p-sm-0 email-one-sm-container-px">
        <form class="ps-xl-0 email-one-xl-ps">
          <h1
            class="fw-medium text-black fs-2xl form-heading first-form-heading-mb"
          >
            Love to hear from you, Get in touch
          </h1>
          <div class="row">
            <div class="col-12 col-md-6">
              <label for="name" class="label-text email-one-label-pb"
                >Your name
              </label>
              <div class="input-bg name-max-w">
                <input
                  type="text"
                  placeholder="Edward Snowden"
                  class="name-max-w email-one-input-py px-3 input-text fs-6 fw-normal h-2xl input-h-sm"
                />
              </div>
              <label
                for="company"
                class="label-text email-one-label-pb email-one-label-mt"
                >What you are interested in
              </label>
              <div class="input-bg name-max-w">
                <input
                  type="text"
                  placeholder="Design & Branding"
                  class="name-max-w email-one-input-py px-3 input-text fs-6 fw-normal h-2xl input-h-sm"
                />
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label
                for="name"
                class="label-text email-one-label-pb sm-email-one-label-mt-2xl"
                >Your email
              </label>
              <div class="input-bg name-max-w">
                <input
                  type="text"
                  placeholder="itanexample@gmail.com"
                  class="name-max-w email-one-input-py px-3 input-text fs-6 fw-normal h-2xl input-h-sm"
                  required
                />
              </div>
              <label
                for="company"
                class="label-text email-one-label-pb email-one-label-mt"
                >Project Budget
              </label>
              <div class="input-bg name-max-w">
                <input
                  type="text"
                  placeholder="Select your budget"
                  class="name-max-w email-one-input-py px-3 input-text fs-6 fw-normal h-2xl input-h-sm"
                />
              </div>
            </div>
            <label
              for="message"
              class="label-text email-one-label-pb mt-sm-4 email-one-sm-mt"
              >Message</label
            >
            <div class="sm-center-text-area">
              <textarea
                name="message"
                id="message"
                class=" email-one-text-area-sm-px email-one-textarea-height input-bg mx-sm-0 email-one-text-area-sm-mx first-form-text-area-w email-one-input-py px-3 input-text fs-6 fw-normal mr-3 resize-none"
                placeholder="Let tell us know your project about"
              ></textarea>
            </div>
            <button class="send-btn fw-semibold fs-6 email-one-btn-mt">
              Just Send
            </button>
          </div>
        </form>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
