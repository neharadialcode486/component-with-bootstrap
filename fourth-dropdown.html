<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop down 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/fourth-dropdown.css">
</head>
<!-- Drop-Down 4 UI -->

<body class="bg-black">
    <section class="min-vh-100 d-flex justify-content-center align-items-center">
        <div class="position-relative d-inline-block group">
            <div class="d-flex bg-light align-items-center justify-content-between gap-3 w-100 cursor-pointer button">
                <button class="btn fw-normal p-0">More options</button>
                <svg class=" arrow-icon" width="12" height="8" viewBox="0 0 12 8" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z" fill="#4C4C4C" />
                </svg>
            </div>
            <div class="d-none position-absolute z-index-10 group-hover-block pt-1">
                <div class="rounded min-w-185 content-parent border bg-white w-100">
                    <!-- dropdown-item-1 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">All</a>
                    </div>

                    <!-- dropdown-item-2 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Address</a>
                    </div>

                    <!-- dropdown-item-3 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Type</a>
                    </div>

                    <!-- dropdown-item-4 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Status</a>
                    </div>

                    <!-- dropdown-item-5 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Price</a>
                    </div>

                    <!-- dropdown-item-6 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Auction</a>
                    </div>

                    <!-- dropdown-item-7 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Rooms</a>
                    </div>

                    <!-- dropdown-item-8 -->
                    <div class="d-flex align-items-center ps-4 gap-2 dropdown-item-parent text-decoration-none">
                        <img src="./assets/images/svg/right-click.svg" alt="img">
                        <a class="dropdown-item-custom font-normal text-decoration-none" href="#">Square meters</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
