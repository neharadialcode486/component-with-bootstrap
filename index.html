<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dropdown-selector</title>
    <link rel="stylesheet" href="/assets/css/dropdown.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="font-inter bg-black">
<section class="d-flex align-items-center justify-content-between min-vh-100">
  <div class="d-flex justify-content-center gap-3 flex-wrap mx-auto">
    
    <!-- Dropdown 1 -->
    <div class="dropdown">
      <button class="fw-normal dropdown-one-btn btn dropdown-toggle-one d-flex align-items-center justify-content-between position-relative" type="button" id="dropdown1-button" data-bs-toggle="dropdown" aria-expanded="false">
        Featured
      </button>
      <ul class="dropdown-menu dropdown-menu-one" aria-labelledby="dropdown1-button">
        <li class="dropdown-data-one firstdropdown-menu"><a class="dropdown-item firstdropdown-menu" href="#" data-value="Featured">Featured</a></li>
        <li class="dropdown-data-one firstdropdown-menu"><a class="dropdown-item firstdropdown-menu" href="#" data-value="New">New</a></li>
        <li class="dropdown-data-one firstdropdown-menu"><a class="dropdown-item firstdropdown-menu" href="#" data-value="Rating">Rating</a></li>
      </ul>
    </div>

    <!-- Dropdown 2 -->
    <div class="dropdown">
      <button class="btn dropdown-menu-two dropdown-toggle d-flex align-items-center gap-3" type="button" id="status-button" data-bs-toggle="dropdown" aria-expanded="false">
        Status
      </button>
      <ul class="dropdown-menu dropdown-menu-two-links" aria-labelledby="status-button">
        <li class="d-flex align-items-center second-dropdown-menu gap-2 dropdown-menu-two-links second-dropdown-menu-height"><img src="/assets/images/svg/check-box-icon.svg" alt="check-box-icon"><a class="dropdown-item px-0 seond-dropdown-links" href="#" data-value="All">All</a></li>
        <li class="d-flex align-items-center second-dropdown-menu gap-2 dropdown-menu-two-links second-dropdown-menu-height"><img src="/assets/images/svg/check-box-icon.svg" alt="check-box-icon"><a class="dropdown-item px-0 seond-dropdown-links" href="#" data-value="Done">Done</a></li>
        <li class="d-flex align-items-center second-dropdown-menu gap-2 dropdown-menu-two-links second-dropdown-menu-height"><img src="/assets/images/svg/check-box-icon.svg" alt="check-box-icon"><a class="dropdown-item px-0 seond-dropdown-links" href="#" data-value="Open">Open</a></li>
        <li class="d-flex align-items-center second-dropdown-menu gap-2 dropdown-menu-two-links second-dropdown-menu-height"><img src="/assets/images/svg/check-box-icon.svg" alt="check-box-icon"><a class="dropdown-item px-0 seond-dropdown-links" href="#" data-value="Close">Close</a></li>
        <li class="d-flex align-items-center second-dropdown-menu gap-2 dropdown-menu-two-links second-dropdown-menu-height"><img src="/assets/images/svg/check-box-icon.svg" alt="check-box-icon"><a class="dropdown-item px-0 seond-dropdown-links" href="#" data-value="In progress">In progress</a></li>
      </ul>
    </div>

    <!-- Dropdown 3 -->
    <div class="dropdown">
      <button class="btn btn-danger dropdown-toggle" type="button" id="advertisement-button" data-bs-toggle="dropdown" aria-expanded="false">
        Advertisement
      </button>
      <ul class="dropdown-menu" aria-labelledby="advertisement-button">
        <li><a class="dropdown-item" href="#" data-value="All">All</a></li>
        <li><a class="dropdown-item" href="#" data-value="Teststrasse 10">Teststrasse 10</a></li>
        <li><a class="dropdown-item" href="#" data-value="Hohlstrasse 11">Hohlstrasse 11</a></li>
        <li><a class="dropdown-item" href="#" data-value="Culmannste 64">Culmannste 64</a></li>
        <li><a class="dropdown-item" href="#" data-value="Lucernesti 96">Lucernesti 96</a></li>
      </ul>
    </div>

    <!-- Dropdown 4 -->
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" type="button" id="more-options-button" data-bs-toggle="dropdown" aria-expanded="false">
        More options
      </button>
      <ul class="dropdown-menu" aria-labelledby="more-options-button">
        <li><a class="dropdown-item" href="#" data-value="All">All</a></li>
        <li><a class="dropdown-item" href="#" data-value="Address">Address</a></li>
        <li><a class="dropdown-item" href="#" data-value="Type">Type</a></li>
        <li><a class="dropdown-item" href="#" data-value="Status">Status</a></li>
        <li><a class="dropdown-item" href="#" data-value="Price">Price</a></li>
        <li><a class="dropdown-item" href="#" data-value="Auction">Auction</a></li>
        <li><a class="dropdown-item" href="#" data-value="Rooms">Rooms</a></li>
        <li><a class="dropdown-item" href="#" data-value="Square meters">Square meters</a></li>
      </ul>
    </div>

  </div>
</section>

<!-- Bootstrap JS (optional, for dropdown functionality) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="/assets/js/dropdown.js"></script>
  </body>
</html>
