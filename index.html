<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>email-js-two-bootstrap</title>
    <link rel="stylesheet" href="/assets/css/counter.css">
    <link rel="stylesheet" href="/assets/css/email.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="font-inter">
    <!------form--- -->
     <section class="min-vh-100 d-flex align-items-center justify-content-center my-3xl">
        <div class="container">
            <div class="d-flex align-items-center justify-content-center gap-lg-5 gap-lg-3 gap-xl flex-col-rever-lg ">
                
                    <div class="white-card email-two-card-p-2xll">
                        <form class="d-flex align-items-center justify-content-center flex-column">
                            <input type="text" placeholder="Name" class="third-form-input-h form-two-input fw-normal fs-6 mt-lg-5 md-mt-xl w-100 input-box-border mx-3xl third-form-input-py-xl third-form-input-px-1xl">
                            <input type="email" required placeholder="Email address" class="third-form-input-h form-two-input fw-normal fs-6 mt-3 w-100 input-box-border mx-3xl third-form-input-py-xl third-form-input-px-1xl">
                            <input type="text" placeholder="Contact" class="third-form-input-h form-two-input fw-normal fs-6 mt-3 w-100 input-box-border mx-3xl third-form-input-py-xl third-form-input-px-1xl">
                            <textarea name="message" id="message" class="resize-none form-two-input mt-3 h-[107px] w-100 input-box-border third-form-input-py-xl third-form-input-px-1xl" placeholder="Message"></textarea>
                            <div class="w-100 me-auto">
                             <button class="third-form-send-btn fw-semibold fs-6 email-two-btn-ml-start-2xl">Submit</button>
                             </div>
                        </form>
                       
                    </div>
                
                <div class="card-text tranform-y-4xl">
                    <h2 class="fw-semibold fs-1xl text-black mt-xxl leading-xl second-form-heading mb-0">Get In Touch</h2>
                    <p class="fw-normal fs-sm-6 second-form-text pt-3 email-two-text-max-w-xxl m-0">Lorem ipsum dolor sit amet consectetur. Velit pulvinar libero porttitor quam sed aliquet. Sodales vulputate elementum arcu donec. Feugiat nibh ullamcorper egestas lectus risus ornare ullamcorper fames. Cursus libero nec facilisis risus malesuada arcu cum. </p>
                    <button class="get-btn email-two-max-w-4xl get-btn-mt-xl fw-semibold">Get in Touch </button>
                </div>
            </div>
        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="/assets/js/counter.js"></script>
  </body>
