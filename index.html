<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop down 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/drop-down.css">
</head>

<body class="bg-black">
  <section class="min-vh-100 d-flex justify-content-center align-items-center">
    <div class="dropdown relative inline-block group">
      <div class="button d-flex bg-white px-3 py-2 align-items-center gap-3 rounded-top rounded-bottom">
        <button class="btn btn-link p-0 m-0 fw-normal">Featured</button>
        <svg class="arrow-icon" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z" fill="#2B2B2B" />
        </svg>

      </div>
      <div
        class="dropdown-menu-custom hidden position-absolute bg-white w-100 z-10 group-hover-show rounded-bottom mt-1">
        <a href="#" class="dropdown-item-custom">Featured</a>
        <a href="#" class="dropdown-item-custom">New</a>
        <a href="#" class="dropdown-item-custom rounded-bottom">Rating</a>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
