<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Count-down</title>
  <link rel="stylesheet" href="/assets/css/countdown.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body class="font-inter">
    <section class="min-vh-100 d-flex justify-content-center align-items-center max-lg:py-10">
    <div class="container position-relative">
      <img class="translate-y-sm w-100" src="./assets/images/png/polygon-image.png" alt="top layer">
      <div class="bg-lightPink d-flex gap-5xxl justify-content-center align-items-center lg-flex-col">
        <div class=" col-lg-6 col-12 max-lg-w-full d-flex flex-column align-items-center max-lg-jcc">
          <div
            class="max-w-4xll max-lg-flex max-lg-flex-col max-lg-aic max-lg-jcc content-px-3 max-md-pt-5">
            <h2 class="count-down-heading fw-normal m-0 headin-line-height tracking-heading">Sale Of <span
                class="fw-bold">The Day</span></h2>
            <p class="text-base fw-normal content-pt-4 opacity-7 max-md:text-sm m-0 line-height-2xl text-tracking">Don't miss out on our exclusive
              daily deals!
              Enjoy
              significant discounts on
              select traditional Moroccan garments.</p>
            <div class="d-flex gap-5xxl pt-sm">
              <div class="d-flex flex-column gap-2">
                <div id="hours" class="d-flex fs-5xl fw-medium max-lg-text-5xl max-md-text-4xl timer-tracking">
                  <span id="hours_0">0</span><span id="hours_1">0</span>
                </div>
                <p class="text-base max-md:text-sm m-0 line-height-2xl">Hours</p>
              </div>
              <span class="fs-5xl fw-medium max-lg-text-5xl max-md-text-4xl">:</span>
              <div class="d-flex flex-column gap-2">
                <div id="minutes" class="d-flex fs-5xl fw-medium max-lg-text-5xl max-md-text-4xl timer-tracking">
                  <span id="minutes_0">0</span><span id="minutes_1">0</span>
                </div>
                <p class="text-base max-md:text-sm m-0 line-height-2xl">Minutes</p>
              </div>
              <span class="fs-5xl fw-medium max-lg-text-5xl max-md-text-4xl">:</span>
              <div class="d-flex flex-column gap-2">
                <div id="seconds" class="d-flex fs-5xl fw-medium max-lg-text-5xl max-md-text-4xl timer-tracking">
                  <span id="seconds_0">0</span><span id="seconds_1">0</span>
                </div>
                <p class="text-base max-md:text-sm m-0 line-height-2xl">Seconds</p>
              </div>
            </div>

            <button
              class="text-white bg-orange btn py-1xl px-2xl rounded-lg text-base max-md:text-sm fw-bold mt-10 line-height-2xl">Shop
              Now</button>
          </div>
        </div>
        <div class="col-lg-6 col-12 max-lg-w-full">
          <img src="./assets/images/png/clothes-brand.png" alt="image" class="w-100">
        </div>
      </div>
    </div>
  </section>
  <script src="/assets/js/countdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
