<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Second Tab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="/assets/css/navtabs.css" />
</head>

<body class="font-inter">
  <!-- -------Tab two----- -->
  <section class="min-vh-100 d-flex justify-content-center align-items-center">
    <div class="container mt-5">
      <div class="text-center pb-4">
        <h2 class="display-4 fw-normal">Shop By <span class="fw-bold">Category</span></h2>
        <p class="mx-auto opacity-70 pt-3" style="max-width: 695px;">Explore our extensive collection of traditional
          Moroccan garments, each crafted with care and precision to bring you the finest in cultural fashion.</p>
      </div>
      <div
        class="mx-auto d-flex justify-content-between align-items-center mb-4 gap-2 p-2 border border-secondary rounded-pill overflow-auto"
        style="max-width: 551px;">
        <button data-target="djellabas"
          class="btn active fw-bold rounded-pill nav active d-flex align-items-center justify-content-center"
          style="min-width: 125px;">Djellabas</button>
        <button data-target="gandoras"
          class="btn fw-bold rounded-pill nav d-flex align-items-center justify-content-center"
          style="min-width: 129px;">Gandoras</button>
        <button data-target="caftans"
          class="btn fw-bold rounded-pill nav d-flex align-items-center justify-content-center"
          style="min-width: 115px;">Revenue</button>
        <button data-target="gandoras"
          class="btn fw-bold rounded-pill nav d-flex align-items-center justify-content-center"
          style="min-width: 132px;">Campaigns</button>
      </div>
      <div class="mt-4 mx-auto" style="max-width: 1140px;">
        <div id="djellabas" class="tabsInfoTwo">
          <div class="swiper w-100 max-w-5xl mx-auto pb-5">
            <div class="swiper-wrapper d-flex gap-2">
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/djellabas.webp" alt="djellabas">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/gandoras.webp" alt="gandoras">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/caftans.webp" alt="caftans">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/gandoras.webp" alt="Gandoras">
              </div>
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div id="gandoras" class="d-none tabsInfoTwo">
          <div class="swiper w-100 max-w-5xl mx-auto pb-5">
            <div class="swiper-wrapper d-flex gap-2">
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/gandoras.webp" alt="Caftans">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/caftans.webp" alt="Djellabas">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/djellabas.webp" alt="Gandoras">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/caftans.webp" alt="Gandoras">
              </div>
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div id="caftans" class="d-none tabsInfoTwo">
          <div class="swiper w-100 max-w-5xl mx-auto pb-5">
            <div class="swiper-wrapper d-flex gap-2">
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/caftans.webp" alt="Caftans">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/gandoras.webp" alt="Djellabas">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/djellabas.webp" alt="Gandoras">
              </div>
              <div class="swiper-slide">
                <img class="nav-2-img" src="./assets/images/png/gandoras.webp" alt="Gandoras">
              </div>
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/assets/js/navtabs.js"></script>
</body>

</html>
