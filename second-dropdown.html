<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop down</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/second-dropdown.css">
</head>

<body class="bg-black">
    <section class="min-vh-100 d-flex justify-content-center align-items-center">
        <div class="position-relative d-inline-block group">
            <div class="button d-flex bg-light justify-content-between align-items-center gap-1 w-auto cursor-pointer">
                <button class="btn border-0 fw-semibold ">Status</button>
                <svg class="arrow-icon" width="12" height="8" viewBox="0 0 12 8" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z" fill="#5E0612" />
                </svg>
            </div>
            <div class="d-none position-absolute z-index-10 group-hover-block pt-1 min-w-100">
                <div class="bg-white w-100 rounded">
                    <div class="d-flex align-items-center ps-4 gap-2 py-2">
                        <img src="./assets/images/svg/right-click.svg" alt="">
                        <a class="dropdown-item-custom fw-normal text-decoration-none" href="#">All</a>
                    </div>
                    <div class="d-flex align-items-center ps-4 gap-2 py-2">
                        <img src="./assets/images/svg/right-click.svg" alt="">
                        <a class="dropdown-item-custom fw-normal text-decoration-none" href="#">Done</a>
                    </div>
                    <div class="d-flex align-items-center ps-4 gap-2 py-2">
                        <img src="./assets/images/svg/right-click.svg" alt="">
                        <a class="dropdown-item-custom fw-normal text-decoration-none" href="#">Open</a>
                    </div>
                    <div class="d-flex align-items-center ps-4 gap-2 py-2">
                        <img src="./assets/images/svg/right-click.svg" alt="">
                        <a class="dropdown-item-custom fw-normal text-decoration-none" href="#">Close</a>
                    </div>
                    <div class="d-flex align-items-center ps-4 gap-2 py-2">
                        <img src="./assets/images/svg/right-click.svg" alt="">
                        <a class="dropdown-item-custom fw-normal text-decoration-none" href="#">In
                            progress</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
