<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counter</title>
    <link rel="stylesheet" href="/assets/css/counter.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="font-inter">
    <!-- plat-form -->
       <section class="min-vh-100 second-counter-bg d-flex justify-content-center align-items-center position-relative">
       
        <div class="container py-8xl">
            <div class="text-center">
                <p class="text-venice-blue text-balance font-medium">PLATFORM</p>
                <p class="fs-4xl fw-normal pt-1.5 max-lg:text-4xl max-md:text-3xl max-sm:text-2xl">Through <span
                        class="fw-semibold">Our
                        Platform</span></p>
                <p class="text-base fw-normal opacity-7xl pt-3">We’ve helped out partners and patients achieve</p>
            </div>
            <div id="counter"
                class="d-flex flex-wrap gap-xl justify-content-center align-items-center mt-[60px] max-md:mt-10 max-sm:mt-6">
                <div class="platform-box-one platform-box-py-1xl platform-box-px-2xl bg-lightgreen text-center position-relative plaform-card">
                    <div class="d-flex justify-content-center">
                        <p class="fw-semibold text-white text-6xl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl count"
                            data-count="50">0</p>
                        <span
                            class="fw-semibold text-white text-6xl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl">%</span>
                    </div>
                    <p class="text-xl fw-normal text-white">Reduction <span class="block">in Pain</span></p>
                    <img class="position-absolute right-0 bottom-0 pointer-events-none"
                        src="./assets/images/svg/box-shadow.svg" alt="plus">
                </div>
                <div class="platform-box-one py-3xxl px-4xl bg-offGreen text-center position-relative plaform-card">
                    <div class="d-flex justify-content-center ">
                        <p class="fw-semibold text-white fs-xxl count" data-count="90">0</p>
                        <span
                            class="fw-semibold text-white fs-xxl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl">%</span>
                    </div>
                    <p class="text-xl fw-normal text-white">Increase In-Patient<span class="block">Satisfaction</span>
                    </p>
                    <img class="position-absolute right-0 bottom-0 pointer-events-none"
                        src="./assets/images/svg/box-shadow.svg" alt="plus">
                </div>
                <div class="platform-box-one py-5xl px-5xl bg-darkgreen text-center position-relative plaform-card rounded">
                    <div class="d-flex justify-content-center">
                        <p class="fw-semibold text-white fs-xxl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl count"
                            data-count="60">0</p>
                        <span
                            class="fw-semibold text-white fs-xxl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl">%</span>
                    </div>
                    <p class="text-xl fw-normal text-white">Faster Recovery</p>
                    <img class="position-absolute right-0 bottom-0 pointer-events-none"
                        src="./assets/images/svg/box-shadow.svg" alt="plus">
                </div>
            </div>
        </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="/assets/js/countertwo.js"></script>
  </body>
</html>
